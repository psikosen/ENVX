version: '3.8'

services:
  paop:
    build:
      context: .
      dockerfile: Dockerfile
    image: paop:dev
    container_name: paop_service
    environment:
      - PAOP_API_KEY=your-secure-key
      - PAOP_LOG_LEVEL=INFO
      - OLLAMA_HOST=http://ollama:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-''}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-''}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-''}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    restart: unless-stopped
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
      
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ollama_data:
